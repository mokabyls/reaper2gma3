name: Test, build and deploy

on:
    # Permet de relancer un déploiement à la main, sans avoir à créer un commit.
    workflow_dispatch:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

# Un push qui en suit un autre annule le précédent : inutile de tester deux fois
# la même branche. Le job de déploiement a sa propre règle, plus bas.
concurrency:
    group: "reaper2gma3-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.15.0
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: pnpm
            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile
            - name: Run tests
              run: pnpm test
            - name: Check TypeScript
              run: pnpm check
            - name: Build production app
              run: pnpm build
            - name: Upload GitHub Pages artifact
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: build
                  name: github-pages

    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: build
        permissions:
            pages: write
            id-token: write
        # Un déploiement Pages en cours ne doit jamais être annulé en plein vol :
        # la page servie resterait dans un état intermédiaire.
        concurrency:
            group: "github-pages"
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
